    use:
      mail: ["{balance}", "{alert_amount}", "{alert_merchant}", "28th", "statement", "alert"]
      reminders: ["reminder", "{future_weekday}", "{future_date_short}", "{future_day_ordinal}", "9:00", "9 am", "9am"]
  trap: "the statement and a card alert are in mail, the pay-the-bill reminder is in Reminders"

- id: src_topic_budget
