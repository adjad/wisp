<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wisp Sandbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/phone.css">
</head>
<body>
  <div class="device">
    <div class="device-screen">
      <div class="status-bar">
        <span class="clock" id="statusClock">9:41</span>
        <div class="island"></div>
        <span class="glyphs">Wisp Sandbox</span>
      </div>
      <div class="screen-body" id="screen"></div>
      <div class="home-indicator"></div>
    </div>
  </div>

  <div class="dev-rail">
    <div class="panel">
      <h2>Sandbox status</h2>
      <div id="devRail"></div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
