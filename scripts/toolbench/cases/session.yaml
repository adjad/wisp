# Session: what a MULTI-TURN Ask conversation must carry, and what an instruction must keep doing.
#
# Production stores only the user text and the final assistant text of each earlier turn (no tool
# results, no earlier thinking; service/main.py), trimmed to the last ~20 exchanges and then to a token
# budget. So:
#   - a fact an earlier reply STATED (or the user stated) is answered from the conversation, no tool;
#   - a detail the earlier reply did NOT state (an amount, a body, the 2nd item) needs the tool again;
#   - "really? / are you sure? / check again" means re-read with the tool, not repeat the old answer;
#   - a preference or instruction given in the conversation ("one sentence from now on", "no
#     questions", "reply in Spanish", "just the number") keeps applying to every later turn until lifted.
# Most histories are short (3-9 exchanges, under ~700 characters, the recalled fact 2-9 exchanges
# back). The `_long` cases carry 7-10 exchanges with realistic 40-150 word assistant replies (about
# 2,500-4,500 characters), the volume r3 actually failed under; the production budget keeps roughly
# the last 20 exchanges inside about 9,000 characters. Earlier assistant turns are written as ideal
# replies: they already obey any preference set above them. Topics and names (Gus, Hollowell, Pell,
# Castellanos, the tripod) were checked against training/, service/ and the other case files, so
# training prompts are unlikely to collide with them. Placeholders only: the cases grade in every world.
# Answer checks beyond contains_*: max_words, min_words, max_sentences, min_sentences, starts_with_any
# (whole word), regex_all, regex_none (case-insensitive; `(?-i:...)` makes a part case-sensitive),
# no_bullets, language_es (scripts/toolbench/scorer.py). contains_* also fold curly apostrophes and
# "6:40 PM" to "6:40pm". Persistent-preference cases carry
# `pref_` in their id; scripts and EVAL-session.md report them as a group.

# ======================================================================= recall: user-stated fact
- id: sess_user_fact_3
  history:
    - {user: "I'm picking up my sourdough starter, Gus, from my neighbor Mrs. Castellanos on Thursday evening.", assistant: "Gus will be glad to come home. Starters like a regular feeding, so maybe plan on flour and water as soon as you get him back."}
    - {user: "what's 18 times 12?", assistant: "18 times 12 is 216."}
    - {user: "and half of that?", assistant: "Half of 216 is 108."}
  prompt: "who's giving me the sourdough starter again?"
  no_tool: true
  answer: {contains_all: [Castellanos]}
  trap: "r3 'nothing has been said in our chats before': a fact the USER stated three exchanges ago is in the conversation; no search, no denial"

