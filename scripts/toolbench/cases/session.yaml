# ======================================================================== 'really?' challenges
- id: sess_really_dentist
  history:
    - {user: "when's my dentist appointment?", assistant: "Tomorrow at {dentist_time} with Dr. {dentist}.", tools: get_upcoming, calls: [{name: get_upcoming, args: {period: tomorrow, query: dentist}, result: "Dentist appointment with Dr. {dentist} at {dentist_time}"}]}
    - {user: "what's the capital of Portugal?", assistant: "Lisbon."}
    - {user: "and Spain?", assistant: "Madrid."}
  prompt: "are you sure about that time? check again"
  expect: [{any_of: [get_upcoming, daily_brief]}]
  answer: {contains_all: ["{dentist_time}"]}
  trap: "r3 repeated the old answer on 'really?'; a challenge means look at the calendar again"

- id: sess_really_balance
  history:
    - {user: "what's my {bank} balance?", assistant: "Your {bank} statement balance is ${balance}, due on the 28th.", tools: view_emails, calls: [{name: view_emails, args: {query: "{bank}"}, result: "From: {bank}\nSubject: Your statement is ready\nMessage-ID: m-1002\n\nYour statement balance is ${balance}. Payment is due on the 28th."}]}
    - {user: "is it better to pay the full balance or the minimum?", assistant: "The full balance, when you can. It avoids interest, while the minimum keeps the account in good standing but costs you interest."}
    - {user: "yeah that's what i thought", assistant: "Good instinct."}
  prompt: "really? double check that number"
  expect: [{tool: view_emails}]
  answer: {contains_all: ["{balance}"]}
  trap: "challenge on a number: re-read the statement, then confirm or correct it from the fresh read"

- id: sess_really_flight
  history:
    - {user: "when does mom's flight land?", assistant: "Friday at {flight_time} at SFO, terminal 2.", tools: view_emails, calls: [{name: view_emails, args: {query: flight}, result: "From: Mom <mom@example.com>\nSubject: Flight details\nMessage-ID: m-1001"}]}
