# ======================================================================= drafting a reply reads the thread first
# An earlier turn surfaced the person, but production keeps only the assistant's text, not the thread
# it read. Replying to someone needs their words, so the thread is read again and the draft answers it.
# HOST GAP (service/model_only.py, found while writing these): `pure_writing()` treats "draft a message
# responding to <name>" and "write <name> a reply about ..." as writing with nothing to read, so
# ask_forbidden_tools() withholds view_messages and summarize_messages and the draft cannot be grounded;
# this is how r3 drafted without reading her thread. `_STORED_CONTENT` matches "reply to" and "respond
# to" but not "responding to". The gate cases use phrasings the host already treats as reading
# ("draft a reply to <name>"); the user's exact wording is the dev probe `*_responding_*`, which no model
# can pass until `_STORED_CONTENT` also matches repl(y|ying)/respon(d|ding|se). Flip those to gate then.
- id: brief_draft_reply_friend
  history:
    - user: "what is my plan for saturday"
      assistant: "Saturday has lunch at Mom's place for the Diwali celebration, and {friend_first} is waiting on a reply about dinner at {restaurant} at {dinner_time}."
      tools: get_my_day_plan
  prompt: "draft a reply to {friend_first}"
  expect:
    - any_of: [view_messages, summarize_messages]
    - {tool: draft_message, args: {to: {icontains: "{friend_first}"}, text: {regex: "{restaurant}|dinner|saturday|7|seven|works|sounds|count me|can't|cannot|yes|sure"}}}
  forbid: [send_message, send_email]
  trap: "r3 live test: the draft to the person an earlier turn surfaced was written without reading the thread; the thread is read, then the draft answers the dinner question (a draft, not a send)"
- id: brief_draft_reply_friend_dinner
  history:
    - user: "is there anything I have to do this week"
      assistant: "You owe an RSVP for the block party by 11:59 PM on Friday, there's lunch at Mom's place for Diwali on Saturday, and {friend_first} is waiting on a reply about dinner at {restaurant}."
      tools: get_my_day_plan
  prompt: "draft a reply to {friend_first} about dinner"
  expect:
    - any_of: [view_messages, summarize_messages]
    - {tool: draft_message, args: {to: {icontains: "{friend_first}"}}}
  forbid: [send_message, send_email]
  trap: "the reply is about the thread's own question: read it, then draft"
- id: brief_draft_reply_mom_lunch
  history:
    - user: "how's my weekend looking"
      assistant: "Saturday is lunch at Mom's place for the Diwali celebration, and Sunday you have brunch with {friend_first} and a silk scarf to pick up for Mom."
      tools: get_my_day_plan
  prompt: "draft a reply to mom about the lunch"
  expect:
    - any_of: [view_messages, summarize_messages]
    - {tool: draft_message, args: {to: {regex: "mom|{mom_phone_tail}"}, text: {regex: "saturday|lunch|diwali|bring|there|come|dessert|sweets"}}}
  forbid: [send_message, send_email]
  trap: "the lunch exists only in Mom's text; a good draft needs her wording (what to bring), so the thread is read first"
- id: brief_draft_responding_friend_bare
  split: dev
  history:
    - user: "what is my plan for saturday"
      assistant: "Saturday has lunch at Mom's place for the Diwali celebration, and {friend_first} is waiting on a reply about dinner at {restaurant} at {dinner_time}."
      tools: get_my_day_plan
  prompt: "draft a message responding to {friend_first}"
  expect:
    - any_of: [view_messages, summarize_messages]
    - {tool: draft_message, args: {to: {icontains: "{friend_first}"}}}
  forbid: [send_message, send_email]
  trap: "the user's exact wording from the r3 live test; fails for every model until the host stops treating 'responding to' as pure writing (see the HOST GAP note above)"
- id: brief_draft_responding_mom_bare
  split: dev
  history:
    - user: "how's my weekend looking"
      assistant: "Saturday is lunch at Mom's place for the Diwali celebration, and Sunday you have brunch with {friend_first} and a silk scarf to pick up for Mom."
      tools: get_my_day_plan
  prompt: "draft a message responding to mom about the lunch"
  expect:
    - any_of: [view_messages, summarize_messages]
    - {tool: draft_message, args: {to: {regex: "mom|{mom_phone_tail}"}}}
  forbid: [send_message, send_email]
  trap: "the same host gap with a second subject"
- id: brief_reply_block_party_email
  history:
    - user: "do i have anything on friday"
      assistant: "On Friday you have an RSVP for the block party, due by 11:59 PM, along with yoga and standup."
      tools: get_my_day_plan
  prompt: "reply to the block party email and say we'll be there"
  expect:
    - {tool: view_emails}
    - {any_of: [reply_to_email, draft_email]}
  forbid: [send_message, forward_email]
  trap: "the RSVP is an email's due time: the reply needs that message (its id and address), so the mail is read again before the reply or draft"
