name: Regression gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-regressions:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run complete regression gate
        run: python scripts/test_replay_failure_fixes.py
