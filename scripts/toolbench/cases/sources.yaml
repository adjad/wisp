# ---------------------------------------------------------------------------- nothing anywhere
- id: src_nothing_tennis
  split: heldout_sources
  prompt: "when's my next tennis lesson?"
  forbid: *w
  max_calls: 8
  answer:
    regex_all: ["\\b(?:no|not|nothing|none|couldn't|could not|didn't|don't|haven't|can't|cannot|isn't|aren't)\\b"]
    regex_none: ["tennis lesson (?:is|starts|begins) (?:at|on)"]
  sources:
    shape: nothing
    read: [mail, messages, calendar, notes]
  trap: "no source mentions it: the answer says so after looking everywhere, and invents nothing"

