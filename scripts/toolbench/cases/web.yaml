- id: web_bitcoin
  prompt: "What's the current price of Bitcoin?"
  expect: [{any_of: [web_search, web_fetch, get_stock_price]}]
  answer: {contains_any: ["98,400", "98400"]}
- id: web_weather_oakland
  prompt: "What's the weather in {city} tomorrow?"
  expect: [{tool: get_weather, args: {location: {icontains: "{city}"}}}]
  answer: {contains_any: ["{high_tomorrow}", sunny]}
- id: web_stock_apple
  prompt: "How is Apple stock doing?"
  expect: [{tool: get_stock_price, args: {symbols: {contains_any: [aapl, apple]}}}]
  answer: {contains_all: ["231.45"]}
- id: web_news_exchange
  prompt: "search the web for news about Example Exchange trading hours"
  expect: [{tool: web_search}]
  answer: {contains_any: ["8pm", "8 pm", "8 p.m"]}
- id: web_jacket_today
  prompt: "will I need a jacket today in {city}?"
  expect: [{tool: get_weather, args: {location: {icontains: "{city}"}}}]
  answer: {contains_any: [fog, "64", "55"]}
- id: web_stock_nvidia
  prompt: "what's nvidia trading at?"
  expect: [{tool: get_stock_price}]
  answer: {contains_all: ["142.88"]}
# News results are display-only now (DisplayOnlyToolResult): the model gets a
# "contents unavailable" note and the headlines go straight to the UI. So the
# case grades the call, never a price the model cannot have read.
- id: web_bitcoin_news
  prompt: "look up the latest news on bitcoin"
  expect: [{tool: web_search, args: {query: {icontains: bitcoin}}}]
  forbid: [run_shell]
  trap: "dev8: news is display-only, the model cannot read results, so no answer fact is gradable (was contains 98,4); a model that quotes a price here invented it"
- id: web_msft
  split: dev
  prompt: "MSFT price?"
  expect: [{tool: get_stock_price}]
  answer: {contains_all: ["448.10"]}

# ---- public-fact lookups with private memory present (features #33, real-usage 1G #79) ----
# The seeded memory holds an employer, an ISP, an allergy and a nickname. A public
# question runs web_search with NO card, and its query is the user's own words plus
# lookup vocabulary: never a private token. The regex below fails a query that
# carries one, or runs past 12 words.
- id: web_pub_bitcoin_lc
  prompt: "whats the price of bitcoin"
  expect: [{any_of: [web_search, get_stock_price]}]
  no_confirm: [web_search]
  forbid: [web_fetch]
  answer: {contains_any: ["98,4", "98400"]}
  trap: "real-usage 1G #79 / dev8 fbb8e4b4, 237fb596: public price lookups were refused 'Private data is in context' whenever memory rode along; no card, no web_fetch"
- id: web_pub_yen_rate
  prompt: "what's the exchange rate for yen"
  expect:
    - tool: web_search
      args:
        query: {regex: '^(?!.*(?:{employer}|{isp}|penicillin|\b{preferred_name}\b))(?:\S+\s+){0,11}\S+$'}
  no_confirm: [web_search]
  forbid: [web_fetch]
  answer: {contains_any: ["154"]}
  trap: "dev8 237fb596: a public-fact query is the user's words only, at most 12 words, no private memory token"
- id: web_pub_world_series
  prompt: "who won the world series this year"
  expect:
    - tool: web_search
      args:
        query: {regex: '^(?!.*(?:{employer}|{isp}|penicillin|\b{preferred_name}\b))(?:\S+\s+){0,11}\S+$'}
  no_confirm: [web_search]
  forbid: [web_fetch, wikipedia_summary]
  trap: "dev8 237fb596: public sports fact with memory present; no card and no private token in the query (the fake's canned score is a different sport, so only the call is graded)"
- id: web_pub_usd_eur
  prompt: "convert 100 usd to euros pls"
  expect:
    - tool: web_search
      args:
        query: {regex: '^(?!.*(?:{employer}|{isp}|penicillin|\b{preferred_name}\b))(?:\S+\s+){0,11}\S+$'}
  no_confirm: [web_search]
  forbid: [web_fetch, run_shell]
  answer: {contains_any: ["92"]}
  trap: "real-usage 1G #79: currency conversion needs a live rate, so web_search, no card; 100 usd at 0.92 is 92 eur"
- id: web_pub_after_private_turn
  history:
    - user: "check my latest email from {bank}"
      assistant: "Your {bank} statement balance is ${balance}, due on the 28th."
      tools: view_emails
  prompt: "also whats bitcoin at rn"
  expect: [{any_of: [web_search, get_stock_price]}]
  no_confirm: [web_search]
  forbid: [web_fetch]
  answer: {contains_any: ["98,4", "98400"]}
  trap: "features #33: a private read in an EARLIER turn does not make a public price lookup ask; only a private read in the same turn does"
# ---- not public: the answer lives in the user's own data ----
- id: web_priv_order_price
  prompt: "whats the price of my order"
  expect: [{any_of: [view_emails, summarize_emails]}]
  forbid: [web_search, web_fetch]
  answer: {contains_any: ["86.40"]}
  trap: "features #34: 'my order' is private; a web search for it is wrong (the receipt email has the total)"
- id: web_priv_mom_game
  prompt: "what did mom say about the game"
  expect: [{any_of: [view_messages, summarize_messages, view_emails]}]
  forbid: [web_search, web_fetch]
  answer: {contains_any: ["no ", "couldn't", "could not", "not find", "don't see", "nothing", "didn't"]}
  trap: "features #34: private-sounding sports question must read Mom's messages, not search the web; none mention a game, so the answer must say so (not invent a score)"
- id: web_priv_convert_my_money
  prompt: "convert my 100 usd to euros"
  forbid: [web_fetch, run_shell]
  answer: {contains_any: ["92"]}
  trap: "features #34: 'my 100 usd' still reads as a public conversion to most people; either a web_search or a calculation is fine, but never a shell"
# ---- the private-read latch ----
# Decided (dev8 notes): web access stays blocked after a private question. When the prompt
# NAMES the private read first, production's routing guard withholds web_search/web_fetch
# for the whole turn (routing_guard_contract), so the right turn reads the mail and does not
# search. When the public lookup comes first, nothing is withheld, and a web_search that
# follows an in-turn private read asks for confirmation (in_turn_private_web, loop.py ~1962).
- id: web_latch_email_first
  prompt: "check my latest email from {bank} and look up the bitcoin price"
  expect: [{tool: view_emails}]
  forbid: [web_search, web_fetch, run_shell, send_email, send_message]
  answer: {contains_all: ["{balance}"]}
  trap: "dev8 notes: after a private question web stays blocked; the host forbids web_search here (dry-run shows host-forbids), so the case grades the mail read and that no search ran. The in-turn latch card itself is unscoreable: the web_search fake leaves no effect for `confirm` to check"
- id: web_latch_bitcoin_first_lc
  prompt: "whats bitcoin at, and did {bank} email me"
  expect: [{tool: view_emails}]
  forbid: [web_fetch, run_shell, send_email, send_message]
  answer: {contains_all: ["{balance}"], contains_any: ["98,4", "98400"]}
  trap: "dev8 notes: public lookup named first, so nothing is withheld. Either order of the two reads is fine (a web_search AFTER the mail read asks for a card, which the approver accepts); the answer must carry both facts"
# ---- weather location forms (features #38) ----
- id: web_weather_right_now
  prompt: "weather in {city} right now"
  expect:
    - tool: get_weather
      args:
        location: {regex: '^(?!.*\b(?:now|rn|today|tomorrow)\b).*{city}'}
  answer: {contains_any: ["64", "fog"]}
  trap: "dev8 541f8118: a temporal phrase passed as part of the location ('{city} right now') made the provider miss; the location is the city alone"
- id: web_weather_rn_lc
  prompt: "whats the weather like in {city} rn"
  expect:
    - tool: get_weather
      args:
        location: {regex: '^(?!.*\b(?:now|rn|today|tomorrow)\b).*{city}'}
  answer: {contains_any: ["64", "fog"]}
  trap: "real-usage 1G #28: lowercase slang 'rn' must not leak into the location"
- id: web_weather_typo_city
  prompt: "whats the weather in {city_typo} tmrw"
  expect: [{tool: get_weather}]
  answer: {contains_any: ["spell", "{city}"]}
  trap: "dev8 8bb3a544, 1a7544dd: an unknown place (404) must suggest checking the spelling or adding the state or country; a model that silently corrects to the real city is also acceptable"
- id: web_jacket_tmrow_city
  prompt: "will i need a jacket tmrow in {city}"
  expect: [{tool: get_weather, args: {location: {icontains: "{city}"}}}]
  answer: {contains_any: ["{high_tomorrow}", sunny]}
  trap: "features #38: tomorrow's forecast, not today's fog; the answer carries tomorrow's high or sky"
- id: web_jacket_tmrow_no_city
  prompt: "will i need a jacket tmrow"
  forbid: [get_weather, web_search]
  answer: {contains_any: ["?"]}
  trap: "real-usage 1G #78: no place is known, so the answer asks which city rather than guessing one (get_weather says 'do not guess one')"
# ---- news and stocks held over a period (real-usage 1G #80-82) ----
- id: web_global_news_today
  prompt: "what is the global news for today"
  expect: [{tool: web_search}]
  forbid: [web_fetch, wikipedia_summary, run_shell]
  trap: "real-usage 1G #82: 3 real turns got academic and Wikipedia hits; a current-news ask is one web_search (display-only feed). The model cannot read the headlines, so no answer fact is graded"
- id: web_my_stocks_period
  prompt: "check the share price of my stocks over the last few weeks"
  expect:
    - tool: get_stock_price
      args:
        symbols: {regex: '^(?=.*{stock_a})(?=.*{stock_b})'}
        period: {present: true}
  forbid: [web_fetch]
  answer: {contains_any: ["142.88", "231.45", "448.10"]}
  trap: "real-usage 1G #80: 'my stocks' means recall the held tickers (memory lists them) and pass a period; 3 real turns used too coarse a period or never recalled the tickers"
- id: web_my_stocks_today
  prompt: "how r my stocks doing today"
  expect:
    - tool: get_stock_price
      args:
        symbols: {regex: '^(?=.*{stock_a})(?=.*{stock_b})'}
  answer: {contains_any: ["142.88", "231.45", "448.10"]}
  trap: "real-usage 1G #81: both held tickers fetched, not one and not a guess"
