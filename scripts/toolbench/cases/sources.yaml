# ---------------------------------------------------------------------------- sources that disagree
- id: src_conflict_budget
  split: heldout_sources
  prompt: "my calendar says one thing about the budget review and {coworker_first}'s note says another, which is right?"
  forbid: *w
  max_calls: 8
  sources:
    shape: conflict
    read: [mail, calendar]
    use:
      mail: ["thursday", "moved"]
      calendar: ["10:00", "10 am", "10am", "saturday", "nov 7"]
  trap: "the email says it moved to Thursday, the calendar still shows another day; the answer names both"

- id: src_conflict_bill
