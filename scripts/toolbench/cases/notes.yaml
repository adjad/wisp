- id: notes_latte
  prompt: "Search my notes for latte"
  expect: [{tool: search_notes, args: {query: {icontains: latte}}}]
  answer: {contains_any: ["{milk}", espresso]}
- id: notes_gift_sam
  prompt: "what gift ideas did I write down for {friend_first}?"
  expect: [{tool: search_notes}]
  answer: {contains_any: ["{gift_friend}"]}
- id: notes_create_groceries
  prompt: "Make a note called Groceries with eggs, spinach and coffee"
  expect: [{tool: create_note, args: {title: {icontains: groceries}}}]
  forbid: [append_note]
- id: notes_packing
  prompt: "what's on my packing list?"
  expect: [{tool: search_notes}]
  answer: {contains_any: [passport, boots]}
- id: notes_append_packing
  prompt: "add a rain jacket to my packing list note"
  expect: [{tool: append_note, args: {title: {icontains: packing}, text: {icontains: rain}}}]
  forbid: [create_note]
- id: notes_missing_topic
  prompt: "what did I write about the zebra project?"
  expect: [{tool: search_notes}]
  answer: {contains_any: ["no ", "don't", "couldn't", "not find", "nothing", "didn't"]}
  trap: "nothing exists; the answer must say so, not invent a note"
- id: notes_mom_gift
  split: dev
  prompt: "what did I want to get mom?"
  expect: [{tool: search_notes}]
  answer: {contains_any: [scarf]}
- id: notes_jot
  split: dev
  prompt: "jot down: call the plumber about the leak"
  expect: [{any_of: [create_note, append_note]}]

# ---- real-life phrasing: lowercase, typos, note vs reminder ----
- id: notes_packing_typo
  prompt: "wats on my packing lst"
  expect: [{tool: search_notes}]
  forbid: [create_note, append_note, search_reminders]
  answer: {contains_any: [passport, boots, charger]}
  trap: "real-usage style (20 of 110 turns carry a typo): a misspelled list name still reads the note, not a reminders search"
- id: notes_append_power_bank
  prompt: "add a power bank to packing list"
  expect: [{tool: append_note, args: {title: {icontains: packing}, text: {icontains: power bank}}}]
  forbid: [create_note, add_reminder]
  trap: "lowercase append with no 'my' and no 'note': the list exists, so append, never a second note or a reminder"
- id: notes_save_vs_remind
  prompt: "save this to my notes: call the vet monday"
  expect: [{any_of: [create_note, append_note]}]
  forbid: [add_reminder, add_calendar_event]
  trap: "'monday' invites a reminder or event, but the user asked for a note"
- id: notes_gift_lc_typo
  prompt: "wat did i put down as a gift for {friend_first}"
  expect: [{tool: search_notes}]
  answer: {contains_any: ["{gift_friend}"]}
- id: notes_which_notes_do_i_have
  prompt: "what notes do i have"
  expect: [{tool: search_notes}]
  answer: {contains_any: ["Latte", "Packing", "Gift"]}
  trap: "an unqualified listing request: search_notes with no or an empty query, not a guess from memory"
