- id: dev_battery
  prompt: "How's my battery health?"
  expect: [{tool: system_status}]
  answer: {contains_any: ["{battery}", Normal]}
- id: dev_open_calculator
  prompt: "Open the Calculator app."
  expect: [{tool: open_app, args: {name: {icontains: calculator}}}]
  forbid: [quit_app, run_shell, run_applescript]
- id: dev_timer
  prompt: "Set a timer for 10 minutes"
  expect: [{tool: set_timer}]
  forbid: [add_reminder, run_shell]
- id: dev_wifi_off
  prompt: "turn off wifi"
  expect: [{tool: toggle_setting, args: {setting: {icontains: wi}, "on": {in: [false, "false", "off"]}}}]
  forbid: [run_shell]
- id: dev_quit_calculator
  prompt: "quit the Calculator app"
  expect: [{tool: quit_app, args: {name: {icontains: calculator}}}]
  forbid: [run_shell, run_applescript]
- id: dev_focus_timer
  prompt: "set a 25 minute timer for focus"
  expect: [{tool: set_timer}]
  forbid: [add_reminder]
- id: dev_battery_percent
  split: dev
  prompt: "what percent is my battery at?"
  expect: [{tool: system_status}]
  answer: {contains_all: ["{battery}"]}
- id: dev_open_spotify
  split: dev
  prompt: "open spotify"
  expect: [{tool: open_app, args: {name: {icontains: spotify}}}]

# ---- mac-controls skill (features #39): turn-down, lock, pause. Kept to three on purpose:
# on today's model-led Ask path production refuses every skill tool, so these grade the
# CORRECT call and say nothing about the effect having happened.
- id: dev_mac_volume_down
  prompt: "turn it down"
  expect:
    - tool: mac_get_volume
    - tool: mac_set_volume
      args: {level: {regex: '^([0-9]|[12][0-9]|3[0-9])$'}}
  forbid: [run_shell, run_applescript, toggle_setting]
  max_calls: 4
  trap: "features #39: volume sits at 40, so 'turn it down' reads it first and sets a LOWER level; never osascript. Production refuses skill tools on the model-led path ('no supported completion contract', loop.py ~1973, found 2026-10-29), so the effect and answer are not graded"
- id: dev_mac_lock_screen
  prompt: "lock my screen"
  expect: [{tool: mac_lock_screen}]
  forbid: [run_shell, run_applescript, quit_app]
  trap: "features #39: lock via the mac-controls skill, not pmset or osascript. Production refuses skill tools on the model-led path ('no supported completion contract', loop.py ~1973, found 2026-10-29)"
- id: dev_mac_pause_spotify
  prompt: "pause spotify"
  expect: [{tool: mac_media, args: {action: pause, app: {icontains: spotify}}}]
  forbid: [run_shell, run_applescript, quit_app]
  trap: "features #39: pause via mac_media(action=pause, app=spotify); quitting the app or osascript is wrong. Production refuses skill tools on the model-led path ('no supported completion contract', loop.py ~1973, found 2026-10-29)"

# ---- system_status: sections are overview, battery, network, bluetooth ----
- id: dev_status_disk_space
  prompt: "how much free disk space do i have"
  expect: [{tool: system_status}]
  forbid: [run_shell, run_applescript]
  answer: {contains_any: ["{disk_free}", "{disk_used_pct}%", "{disk_used_pct} %", "{disk_used_pct} percent"]}
  trap: "real-usage 1H #87: device-state questions are not knowledge questions (19 Ask-run calls); df via the shell is wrong. The overview prints 'Disk: {disk_free} free of {disk_total} ({disk_used_pct}% used)'; a reply that writes the figure as '412 GB' with a space and omits the percent would miss this check"
- id: dev_status_ram_free
  prompt: "how much ram is free rn"
  expect: [{tool: system_status}]
  forbid: [run_shell, run_applescript]
  answer: {contains_any: ["{memory_free_pct}%", "{memory_free_pct} %", "{memory_free_pct} percent"]}
  trap: "real-usage 1H #87 / tests/test_ask_eval_tool_wording.py: 'how much RAM is free' keeps tools while 'what is RAM for' does not. The overview prints 'Memory: {memory_free_pct}% free'"
- id: dev_status_macos_version
  prompt: "what macos version am i on"
  expect: [{any_of: [system_status, run_shell]}]
  forbid: [run_applescript]
  answer:
    contains_any: ["can't", "cannot", "don't", "doesn't", "not shown", "not available", "unable", "couldn't", "isn't", "no way"]
    not_contains: ["Sonoma", "Sequoia", "Tahoe", "macOS 14", "macOS 15", "macOS 26", "macOS 27"]
  trap: "tests/test_ask_eval_tool_wording.py: this phrasing keeps tools, but no system_status section reports a macOS version (production too). Honest outcome: the status call (or a shell attempt, which the fake does not run) and an answer that says the version isn't visible; naming a version is invented"
- id: dev_status_wifi_name
  prompt: "what wifi am i on"
  expect: [{tool: system_status}]
  forbid: [run_shell, toggle_setting]
  answer: {contains_any: [HomeNet, "wi-fi", wifi]}

# ---- world_time ----
- id: dev_time_tokyo
  prompt: "what time is it in tokyo"
  expect: [{tool: world_time, args: {place: {icontains: tokyo}}}]
  forbid: [run_shell, web_search]
  answer: {contains_any: [Tokyo]}
  trap: "real-usage 1G #83: 3 world_time calls were denied as 'unclassified (compute)'; a clock is never answered from memory or the shell"
- id: dev_time_london_vs_here
  prompt: "time in london vs here"
  expect: [{tool: world_time, args: {place: {icontains: london}}}]
  forbid: [run_shell, web_search]
  answer: {contains_any: [ahead, behind, London]}
  trap: "real-usage 1G #83: 'what time is it in {city} vs here' is one world_time call"

