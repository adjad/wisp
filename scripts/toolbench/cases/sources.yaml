# Held-out multi-source set (split heldout_sources, sealed): does a question that spans the user's apps
# read each of them, and does the answer use what came back? Scored by scripts/toolbench/sources.py, not by
# call order: `expect` is empty on purpose, because reading mail before messages is no better than the reverse.
# 30 multi-source cases (topic 6, person 5, prep 4, owe 4, one_hit 4, nothing 4, conflict 3) and 10
# single-source contrasts (25%), which must read their one source and stop.
# Everything is the synthetic world in world.py; facts are placeholders so a seeded world grades the same way.
# Wording is fresh: tests/test_toolbench_sources.py keeps every prompt away from the r5 training family's
# prompts. Writes are forbidden everywhere (these are reads).

# ---------------------------------------------------------------------------- topic across everything
- id: src_topic_flight
  split: heldout_sources
  prompt: "what's the deal with my mom's flight?"
  forbid: &w [send_email, send_message, reply_to_email, add_reminder, add_calendar_event, create_note, remember, forget]
  max_calls: 8
  sources:
    shape: topic
    read: [mail, messages]
    use:
      mail: ["{flight_time}", "sfo", "terminal 2", "lands"]
      messages: ["re:\\b(?:text|texted|texts|message|messaged|asked|asking|checking|wondering)\\b"]
  trap: "the flight is in mail (time, airport) and a text asks whether the email was seen; reading one source leaves half the picture"

- id: src_topic_parents_dinner
  split: heldout_sources
  prompt: "how's dinner at my parents' house shaping up?"
  forbid: *w
  max_calls: 8
  sources:
    shape: topic
    read: [mail, messages]
    use:
      mail: ["lasagna", "six o'clock", "6 o'clock", "6:00", "6 pm", "6pm"]
      messages: ["pie", "ice cream", "dessert"]
  trap: "dad's email holds the meal and the hour, the family chat holds who brings what"

- id: src_topic_milk
  split: heldout_sources
  prompt: "so what's my story with {milk} milk?"
  forbid: *w
  max_calls: 8
  sources:
    shape: topic
    read: [notes, memory]
    use:
      notes: ["200ml", "18g", "espresso", "steam", "latte"]
      memory: ["prefer", "preference", "favorite", "favourite", "likes"]
  trap: "a recipe in Notes and a saved preference in memory; neither source mentions the other"

- id: src_topic_passport
  split: heldout_sources
  prompt: "what's the status of my passport?"
  forbid: *w
  max_calls: 8
  sources:
    shape: topic
    read: [reminders, notes]
    use:
      reminders: ["reminder", "due", "10:00", "10 am", "10am", "weeks", "days away"]
      notes: ["packing", "charger", "boots", "sunscreen"]
  trap: "a dated reminder and a line in the packing list"

- id: src_topic_bank
  split: heldout_sources
  prompt: "is {bank} waiting on me for anything?"
  forbid: *w
