# ================================================================== persistent preferences (pref_)
- id: sess_pref_onesent_chat
  history:
    - {user: "from now on keep every answer to one sentence", assistant: "Understood, one sentence from here on."}
    - {user: "how many legs does a spider have?", assistant: "A spider has eight legs."}
    - {user: "and an insect?", assistant: "Insects have six legs."}
    - {user: "what's the tallest mountain in the world?", assistant: "Mount Everest is the tallest, at about 29,000 feet above sea level."}
    - {user: "how does a rainbow form?", assistant: "Sunlight bends and reflects inside raindrops, splitting into its colors."}
  prompt: "why is the sky blue?"
  no_tool: true
  answer: {max_sentences: 1, min_words: 5}
  trap: "r3: a length preference lasts one turn. Four exchanges later it is still in force: exactly one sentence"

- id: sess_pref_onesent_tool
  history:
    - {user: "keep it short from now on, one sentence per answer", assistant: "Got it, one sentence each time."}
    - {user: "what time zone is Tokyo in?", assistant: "Tokyo is on Japan Standard Time, which is UTC plus nine."}
    - {user: "thanks", assistant: "Any time."}
    - {user: "what's 15% of 84?", assistant: "15% of 84 is 12.6."}
  prompt: "what's on my calendar tomorrow?"
  expect: [{any_of: [get_upcoming, daily_brief]}]
  answer: {max_sentences: 1, contains_any: ["{dentist_time}", dentist]}
