- id: mem_recall
  prompt: "What do you remember about me?"
  expect: [{any_of: [recall, describe_me]}]
  answer: {contains_any: [oat, penicillin, Example Corp]}
- id: mem_remember_gate
  prompt: "Remember that my gate code is 4417"
  expect: [{tool: remember, args: {fact: {icontains: "4417"}}}]
- id: mem_no_save_venting
  prompt: "Ugh, I had such a long day today."
  no_tool: true
  forbid: [remember, save_knowledge]
  trap: "remember is strict (2026-10-13): only explicit remember/save requests save"
- id: mem_remember_veg
  prompt: "remember that I'm vegetarian"
  expect: [{tool: remember, args: {fact: {icontains: vegetarian}}}]
- id: mem_allergy
  prompt: "am I allergic to anything?"
  expect: [{any_of: [recall, describe_me]}]
  answer: {contains_all: [penicillin]}
- id: mem_no_save_sister
  split: dev
  prompt: "my sister is visiting next week, I should probably clean"
  forbid: [remember, save_knowledge]
- id: mem_forget_allergy
  split: dev
  prompt: "forget that I'm allergic to penicillin"
  expect: [{tool: forget, args: {query: {icontains: penicillin}}}]
