# of history): the volume r3 recall and preference failures actually happened under.
- id: sess_user_fact_long
  history:
    - {user: "My daughter's piano recital is Saturday at Maplewood Hall, and her teacher, Mr. Valderrama, wants everyone there by 3:15.", assistant: "How exciting for her. Saturday at Maplewood Hall, with Mr. Valderrama asking everyone to arrive by 3:15, so it is worth leaving a little cushion for parking. A calm morning and a light lunch usually help young performers feel settled before they go on stage."}
    - {user: "how do I make cold brew coffee at home?", assistant: "Cold brew is easy and very forgiving. Coarsely grind about one cup of coffee beans and stir them into four cups of cold water in a large jar. Cover it and leave it at room temperature or in the fridge for twelve to eighteen hours. Strain it through a fine mesh sieve lined with a coffee filter or cheesecloth, pressing gently rather than squeezing so the brew stays smooth. The result is a concentrate, so dilute it with water or milk to taste, usually about one part concentrate to one part liquid. It keeps in the fridge for about a week."}
    - {user: "why do cats purr?", assistant: "Cats purr for several reasons, and contentment is only one of them. Kittens purr while nursing, which helps them bond with their mother, and many adult cats purr when they are relaxed or being petted. But cats also purr when they are anxious, injured or in pain, and some researchers think the low vibrations are a way of soothing themselves and even supporting healing. So the context matters: a purr paired with kneading and slow blinks usually means comfort, while a purr paired with hiding or a tense body deserves a closer look."}
    - {user: "explain compound interest simply", assistant: "Compound interest means you earn interest not just on the money you put in, but also on the interest you have already earned. Imagine saving one thousand dollars at five percent a year. After the first year you have fifty dollars of interest, so you start the second year with one thousand fifty, and that bigger amount earns a little more. The growth looks slow at first and then speeds up, which is why starting early matters so much. The same effect works against you with debt, because unpaid interest gets added to the balance and starts earning interest for the lender."}
    - {user: "what's a good stretching routine for a desk job?", assistant: "A few gentle stretches done every couple of hours go a long way. Roll your shoulders back and down ten times, then tilt your head toward each shoulder and hold for fifteen seconds. Stand up and clasp your hands behind your back to open the chest, then step into a slow lunge with your hands on your hip to release the hip flexors that tighten from sitting. Finish by reaching your arms overhead and leaning gently to each side. None of it needs equipment, and two or three minutes is enough to feel the difference."}
    - {user: "how do vaccines work?", assistant: "Vaccines train your immune system to recognize a germ before it can make you seriously ill. They contain a harmless piece or weakened form of the germ, or instructions for your cells to make a harmless piece of it. Your body responds as if it were a real infection, producing antibodies and memory cells that stay on guard afterwards. If you later meet the real germ, your immune system recognizes it quickly and responds fast, so the illness is usually milder or avoided altogether. Some vaccines need boosters because that protection fades over time."}
    - {user: "tips for running a first marathon?", assistant: "Give yourself at least sixteen weeks of training and build your weekly mileage gradually, adding no more than about ten percent a week. Your long run each weekend is the backbone of the plan, and it should feel easy and conversational rather than fast. Practice your race-day fueling during those long runs so nothing surprises your stomach, and wear the exact shoes and clothes you plan to race in. Taper over the last two weeks by cutting your mileage, sleep well, and start the race slower than feels necessary, since the second half is where pacing mistakes show up."}
    - {user: "what is an escrow account on a mortgage?", assistant: "An escrow account is a separate account your lender sets up to hold money for your property taxes and homeowners insurance. Each month your mortgage payment includes a portion for these bills, and when they come due the lender pays them for you. This protects the lender, since unpaid taxes could lead to a lien on the home, and it spares you from saving up for large annual bills. Your payment can change from year to year if taxes or insurance premiums go up, and the lender will send an annual statement showing what was collected and paid."}
  prompt: "what was the piano teacher's name again?"
  no_tool: true
  answer: {contains_all: [Valderrama]}
