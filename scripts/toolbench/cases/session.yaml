    regex_none: ['\d{3}[-. )]*\d{4}', '(?-i:\b[A-Z][a-z]+(?: [A-Z][a-z]+)* (?:Nursery|Gardens?|Farms?|Greenhouse)\b)', '(?-i:\b[A-Z][a-z]+ (?:Street|Avenue|Road|Boulevard)\b)', '\bopen (?:until|till|from)\b']
