name: Wisp build

on:
  pull_request:
  push:
    # Feature branches are verified by pull_request. Adding codex/** here runs
    # this expensive required check twice for the same pull-request head.
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign, notarize and publish this version tag (requires release environment approval)'
        type: boolean
        default: false
      publish_ad_hoc:
        description: 'Publish the verified ad-hoc ZIP for this version tag (no Apple credentials)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wisp-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests take the fast path: two isolated macOS jobs run in parallel on
  # the same exact head, and the required "Verified macOS artifact" check below
  # passes only when both pass for that head. Neither job hands files to the
  # other; each checks out and bootstraps independently.
  # Every upload in the PR jobs, and the diagnostics in full, only keeps copies
  # for people to download: continue-on-error, so a full artifact quota can't
  # turn a gate that passed red. In full, the candidate, mini and ACL report
  # uploads stay strict: they are the retained evidence for main and tags
  # (releases still rebuild from source).
  preview:
    name: Preview build (PR)
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate checkout
        id: candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - name: Validate committed dependency locks before bootstrap
        run: python3 -B -c 'import sys; sys.path.insert(0, "build-support"); import pipeline; pipeline.check_locks()'
      # Only dependency download caches; never cache credentials, generated app,
      # runtime installations, test state or Swift executables.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .wisp-build/uv-cache
          key: wisp-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-support/toolchain.json', 'build-support/*.lock') }}
      - name: Qualify isolated signed ACL replacement on disposable macOS
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 build-support/isolated_acl_fixture.py --ephemeral-macos --expected-sha "$CANDIDATE_SHA" --output .wisp-build/run-acl-fixture
      - name: Upload isolated ACL qualification report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wisp-acl-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: .wisp-build/run-acl-fixture/qualification.json
          if-no-files-found: error
          retention-days: 3
      # Same Swift build, assembly, structure/native validation, ad-hoc signing
      # and relocated-backend smoke as `all`. Simulation QA runs in its own job;
      # the artifact is marked preview and every release command refuses it.
      - name: Build, sign and smoke-test preview from source
        run: ./scripts/wisp-build preview --strict-toolchain --fetch-engine --output dist/preview
      - name: Verify synthetic publisher signatures and provisioning transactions
        run: |
          .wisp-build/test-env/bin/python -m venv /tmp/wisp-provisioning-tests
          /tmp/wisp-provisioning-tests/bin/python -m pip install --require-hashes --only-binary=:all: -r build-support/requirements-test.lock
          /tmp/wisp-provisioning-tests/bin/python -m pytest -q tests/test_artifact_signature.py tests/test_node_prep.py tests/test_arrival_completion.py tests/test_local_auth_completion.py tests/test_credential_recovery_completion.py tests/test_primary_runtime_completion.py
      - name: Build and verify exact-candidate offline mini artifact
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 build-support/mini_artifact.py --source-sha "$CANDIDATE_SHA" --output dist/mini
      - name: Upload verified mini artifact
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wisp-mini-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/mini/*
          if-no-files-found: error
          retention-days: 3
      - name: Upload preview build
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wisp-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/preview/*.zip
            dist/preview/*.json
            dist/preview/*.md
            dist/preview/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
      - name: Upload preview diagnostics
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wisp-preview-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .wisp-build/run-*/*.log
            .wisp-build/run-*/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  simulation-qa:
    name: Simulation QA (PR)
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate checkout
        id: candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - name: Validate committed dependency locks before bootstrap
        run: python3 -B -c 'import sys; sys.path.insert(0, "build-support"); import pipeline; pipeline.check_locks()'
      # Only dependency download caches; never cache credentials, generated app,
      # runtime installations, test state or Swift executables.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .wisp-build/uv-cache
          key: wisp-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-support/toolchain.json', 'build-support/*.lock') }}
      # The same simulation_tests stage `all` runs: sandbox contracts, native
      # peer, browser bridge and benchmark contract gates, then the sandboxed
      # full Simulation QA profile with one gate process per runner CPU.
      - name: Run sandboxed Simulation QA and contract gates
        run: ./scripts/wisp-build test --strict-toolchain
      - name: Upload Simulation QA diagnostics
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wisp-qa-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .wisp-build/run-*/*.log
            .wisp-build/run-*/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  full:
    name: Full verified artifact
    # Push to main, v* tags and manual dispatch: every gate, unchanged, plus
    # distribution evidence. Releases rebuild from source after this passes.
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate committed dependency locks before bootstrap
        run: python3 -B -c 'import sys; sys.path.insert(0, "build-support"); import pipeline; pipeline.check_locks()'
      # Only dependency download caches; never cache credentials, generated app,
      # runtime installations, test state or Swift executables.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: github.event_name != 'workflow_dispatch' || !inputs.publish
        with:
          path: .wisp-build/uv-cache
          key: wisp-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-support/toolchain.json', 'build-support/*.lock') }}
      - name: Qualify isolated signed ACL replacement on disposable macOS
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 build-support/isolated_acl_fixture.py --ephemeral-macos --expected-sha "$CANDIDATE_SHA" --output .wisp-build/run-acl-fixture
      - name: Upload isolated ACL qualification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wisp-acl-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: .wisp-build/run-acl-fixture/qualification.json
          if-no-files-found: error
          retention-days: 14
      - name: Build and verify from source
        run: ./scripts/wisp-build all --strict-toolchain --fetch-engine --output dist/candidate
      - name: Verify synthetic publisher signatures and provisioning transactions
        run: |
          .wisp-build/test-env/bin/python -m venv /tmp/wisp-provisioning-tests
          /tmp/wisp-provisioning-tests/bin/python -m pip install --require-hashes --only-binary=:all: -r build-support/requirements-test.lock
          /tmp/wisp-provisioning-tests/bin/python -m pytest -q tests/test_artifact_signature.py tests/test_node_prep.py tests/test_arrival_completion.py tests/test_local_auth_completion.py tests/test_credential_recovery_completion.py tests/test_primary_runtime_completion.py
      - name: Build and verify exact-candidate offline mini artifact
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 build-support/mini_artifact.py --source-sha "$CANDIDATE_SHA" --output dist/mini
      - name: Upload verified mini artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wisp-mini-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/mini/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload verified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wisp-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/candidate/*.zip
            dist/candidate/*.json
            dist/candidate/*.md
            dist/candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wisp-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .wisp-build/run-*/*.log
            .wisp-build/run-*/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  # Required check. Stable name for branch protection; it holds no credentials
  # and runs nothing from the candidate, it only binds the gate results.
  verify:
    name: Verified macOS artifact
    needs: [preview, simulation-qa, full]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every gate for this event on the exact candidate
        env:
          EVENT: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
          PREVIEW_SHA: ${{ needs.preview.outputs.sha }}
          QA_RESULT: ${{ needs.simulation-qa.result }}
          QA_SHA: ${{ needs.simulation-qa.outputs.sha }}
          FULL_RESULT: ${{ needs.full.result }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "preview=$PREVIEW_RESULT ($PREVIEW_SHA) simulation-qa=$QA_RESULT ($QA_SHA) candidate=$CANDIDATE_SHA"
            for gate in "$PREVIEW_RESULT@$PREVIEW_SHA" "$QA_RESULT@$QA_SHA"; do
              if [ "$gate" != "success@$CANDIDATE_SHA" ]; then
                echo "::error::Preview build and Simulation QA must both pass on $CANDIDATE_SHA"
                exit 1
              fi
            done
          else
            echo "full=$FULL_RESULT candidate=$CANDIDATE_SHA"
            if [ "$FULL_RESULT" != "success" ]; then
              echo "::error::Full verified artifact must pass on $CANDIDATE_SHA"
              exit 1
            fi
          fi

  release:
    name: Approved signed release
    needs: full
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Rebuild without an untrusted artifact handoff or restored dependency cache.
      # Credentials are exposed only to the explicit external release step.
      - name: Rebuild approved source with strict validation
        run: ./scripts/wisp-build all --strict-toolchain --fetch-engine --output dist/candidate
      - name: Sign, notarize, verify and publish
        env:
          WISP_RELEASE_APPROVED: 'true'
          WISP_SIGNING_P12_BASE64: ${{ secrets.WISP_SIGNING_P12_BASE64 }}
          WISP_SIGNING_P12_PASSWORD: ${{ secrets.WISP_SIGNING_P12_PASSWORD }}
          WISP_SIGNING_IDENTITY: ${{ secrets.WISP_SIGNING_IDENTITY }}
          WISP_APPLE_API_KEY_BASE64: ${{ secrets.WISP_APPLE_API_KEY_BASE64 }}
          WISP_APPLE_KEY_ID: ${{ secrets.WISP_APPLE_KEY_ID }}
          WISP_APPLE_ISSUER_ID: ${{ secrets.WISP_APPLE_ISSUER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/wisp-build release --output dist/candidate
      - name: Upload release receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wisp-release-receipts-${{ github.sha }}
          path: |
            .wisp-build/run-*/*.log
            .wisp-build/run-*/*.json
            dist/candidate-signed/*.json
            dist/candidate-signed/SHA256SUMS
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  publish-ad-hoc-release:
    name: Publish verified ad-hoc release
    needs: full
    # This is deliberately opt-in and tag-only. It is mutually exclusive with
    # the protected Developer ID/notarization path above, which creates its own
    # signed release and must never be overwritten by an ad-hoc artifact.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_ad_hoc && !inputs.publish && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Rebuild and verify the exact tagged source with no artifact handoff or cache.
      - name: Rebuild ad-hoc source with strict validation
        run: ./scripts/wisp-build all --strict-toolchain --fetch-engine --output dist/candidate
      - name: Publish verified ad-hoc assets
        env:
          WISP_AD_HOC_RELEASE_APPROVED: 'true'
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/wisp-build release-ad-hoc --output dist/candidate
      - name: Upload ad-hoc publication diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wisp-ad-hoc-release-diagnostics-${{ github.sha }}
          path: |
            .wisp-build/run-*/*.log
            .wisp-build/run-*/*.json
            dist/candidate/SHA256SUMS
            dist/candidate/provenance.json
            dist/candidate/bundle-manifest.json
            dist/candidate/dependencies.json
            dist/candidate/simulation-qa.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
