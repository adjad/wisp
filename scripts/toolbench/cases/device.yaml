# ---- timers through manage_timers (a {timer_label} timer is already running) ----
- id: dev_timers_list
  prompt: "any timers running"
  expect: [{tool: manage_timers, args: {action: list}}]
  forbid: [search_reminders, get_upcoming, run_shell]
  answer: {contains_any: ["{timer_label}"]}
  trap: "the world carries a running '{timer_label}' timer; a timer is not a reminder"
- id: dev_timer_time_left
  prompt: "how long is left on my {timer_label} timer"
  expect: [{tool: manage_timers, args: {action: list}}]
  forbid: [search_reminders, run_shell]
  answer: {contains_any: ["{timer_minutes}", "{timer_label}"]}
- id: dev_timer_cancel_named
  prompt: "cancel the {timer_label} timer"
  expect: [{tool: manage_timers, args: {action: cancel, label: {icontains: "{timer_label}"}}}]
  forbid: [cancel_event, clear_reminders, complete_reminder, clear_past_reminders]
  answer: {contains_any: [cancel]}
  trap: "'cancel' must not reach the calendar or reminder tools; the running timer is the target"
- id: dev_timer_cancel_all
  prompt: "kill all my timers"
  expect: [{tool: manage_timers, args: {action: cancel_all}}]
  forbid: [cancel_event, clear_reminders, clear_past_reminders]
- id: dev_stopwatch_start
  prompt: "start a stopwatch"
  expect: [{tool: manage_timers, args: {action: stopwatch_start}}]
  forbid: [set_timer, add_reminder]
- id: dev_timer_set_lc
  prompt: "timer 15 mins pls"
  expect: [{tool: set_timer, args: {duration: {regex: '15|fifteen'}}}]
  forbid: [add_reminder, run_shell]
  trap: "real-usage style: terse lowercase fragment, no verb"
- id: dev_timer_set_label
  prompt: "set a 20 minute timer for the eggs"
  expect: [{tool: set_timer, args: {duration: {regex: '20|twenty'}, label: {icontains: egg}}}]
  forbid: [add_reminder, run_shell]
- id: dev_alarm_7am
  prompt: "set an alarm for 7am"
  expect: [{any_of: [set_timer, add_reminder]}]
  forbid: [run_shell, run_applescript]
  trap: "uncertainty in the reports: set_timer(kind=alarm) is the tool, but the rules path routes alarms through reminders (f258f1ce); accept either, never a shell"

