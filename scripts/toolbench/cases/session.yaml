# ============================================================ re-read: a detail that was not stated
- id: sess_reread_amount
  history:
    - {user: "any email from {bank}?", assistant: "Yes. {bank} says your statement is ready.", tools: view_emails, calls: [{name: view_emails, args: {query: "{bank}"}, result: "From: {bank} <no-reply@bank.example.com>\nSubject: Your statement is ready\nMessage-ID: m-1002"}]}
    - {user: "ok. how do i say thank you in french?", assistant: "Merci, or merci beaucoup for extra thanks."}
    - {user: "and german?", assistant: "Danke, or danke schon."}
    - {user: "what's 7 times 8?", assistant: "56."}
  prompt: "how much was my statement for?"
  expect: [{tool: view_emails}]
  answer: {contains_all: ["{balance}"], not_contains: ["haven't read", "have not read", "don't have an amount"]}
  trap: "r3 'I haven't read an amount yet': the earlier reply never gave the balance, so the mail has to be read again. Says 'my' on purpose: without it production's knowledge_question strips every tool (see sess_reread_amount_bare)"

- id: sess_reread_amount_bare
  split: dev
  history:
    - {user: "any email from {bank}?", assistant: "Yes. {bank} says your statement is ready.", tools: view_emails, calls: [{name: view_emails, args: {query: "{bank}"}, result: "From: {bank} <no-reply@bank.example.com>\nSubject: Your statement is ready\nMessage-ID: m-1002"}]}
    - {user: "ok. how do i say thank you in french?", assistant: "Merci, or merci beaucoup for extra thanks."}
    - {user: "and german?", assistant: "Danke, or danke schon."}
    - {user: "what's 7 times 8?", assistant: "56."}
  prompt: "how much was that statement for?"
  expect: [{tool: view_emails}]
  answer: {contains_all: ["{balance}"]}
  trap: "HOST GAP, not a model failure: knowledge_question() reads the prompt alone, so this follow-up (no 'my') is classed general knowledge and the turn runs tool-free (ask_direct, zero tools offered). Dev only until the host looks at the history"

- id: sess_reread_alert
  history:
    - {user: "did my card flag anything?", assistant: "Yes. {bank} sent an alert about a large purchase on your card ending {alert_card}.", tools: view_emails, calls: [{name: view_emails, args: {query: alert}, result: "From: {bank} Alerts <alerts@bank.example.com>\nSubject: Alert: large purchase on your card\nMessage-ID: m-1008"}]}
    - {user: "what's a safe way to check a card statement?", assistant: "Look at it only inside your bank's own app or site, never through a link in an email, and compare each line to your receipts."}
    - {user: "makes sense", assistant: "Glad it helps."}
  prompt: "how much was the purchase on my card, and where?"
  expect: [{tool: view_emails}]
  answer: {contains_all: ["{alert_amount}", "{alert_merchant}"]}
  trap: "amount and merchant were never stated; they live in the alert body only. Says 'my' on purpose (host gap: see sess_reread_amount_bare)"

- id: sess_reread_second_item
  history:
    - {user: "show my unread emails", assistant: "1. Mom: Flight details\n2. {bank}: Your statement is ready\n3. {coworker}: Q3 budget review moved", tools: view_emails, calls: [{name: view_emails, args: {unread: true}, result: "From: Mom <mom@example.com>\nSubject: Flight details\nMessage-ID: m-1001\n\n---\n\nFrom: {bank} <no-reply@bank.example.com>\nSubject: Your statement is ready\nMessage-ID: m-1002\n\n---\n\nFrom: {coworker}\nSubject: Q3 budget review moved\nMessage-ID: m-1003"}]}
    - {user: "what's a polite way to say no to a meeting?", assistant: "Something like: thanks for the invite, I can't make it this time, but happy to catch up on the notes afterwards."}
    - {user: "perfect", assistant: "Happy to help."}
    - {user: "how many minutes in 3 hours?", assistant: "180 minutes."}
  prompt: "open the second one"
  expect: [{tool: view_emails}]
  answer: {contains_all: ["{balance}"], not_contains: ["flight lands", "forecast deck"]}
  trap: "r3 'opened the wrong item': 'the second one' still means item 2 of the list three exchanges back, not mom's flight"

- id: sess_reread_body
  history:
    - {user: "anything from {coworker_first}?", assistant: "Yes. {coworker_first} says the Q3 budget review moved.", tools: view_emails, calls: [{name: view_emails, args: {query: "{coworker_first}"}, result: "From: {coworker}\nSubject: Q3 budget review moved\nMessage-ID: m-1003"}]}
    - {user: "what does the acronym KPI stand for?", assistant: "Key performance indicator."}
    - {user: "and OKR?", assistant: "Objectives and key results."}
  prompt: "what day did she move it to, and what am I supposed to bring?"
  expect: [{tool: view_emails}]
  answer: {contains_all: [Thursday, forecast]}
