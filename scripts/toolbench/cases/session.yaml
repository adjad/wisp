    - {user: "what's the difference between weather and climate?", assistant: "Weather describes what the atmosphere is doing in a particular place over a short time, like a rainy afternoon, while climate is the long-term average of that weather over decades, like a region having wet winters and dry summers."}
    - {user: "how do bees make honey?", assistant: "Worker bees collect nectar from flowers, break it down with enzymes in their stomachs, pass it to other bees in the hive, and then fan it with their wings until most of the water evaporates, leaving thick honey that they seal in wax cells."}
